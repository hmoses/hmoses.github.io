name: Add Claude tab anchor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-claude-anchor.yml'

permissions:
  contents: write

jobs:
  patch-guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add hash-driven tab activation
        env:
          CLAUDE_ANCHOR_SCRIPT_B64: 
        run: |
          python -c "from pathlib import Path; import os,base64; p=Path('dev-guide.html'); s=p.read_text(encoding='utf-8'); marker='polyglot-hash-tab-routing'; ins=base64.b64decode(os.environ['CLAUDE_ANCHOR_SCRIPT_B64']).decode(); p.write_text(s if marker in s else s.replace('</body>', ins+'\\n</body>', 1), encoding='utf-8')"
      - name: Commit Claude anchor support
        run: |
          if git diff --quiet -- dev-guide.html; then
            echo "No dev-guide.html changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev-guide.html
          git commit -m "Add Claude tab anchor support"
          git push
