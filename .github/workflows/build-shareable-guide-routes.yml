name: Build shareable guide routes

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-shareable-guide-routes.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build standalone route pages and real tab links
        run: |
          python3 <<'PY'
          from pathlib import Path

          src = Path('dev-guide.html')
          html = src.read_text(encoding='utf-8')

          old_tabs = """<div class=\"tab-bar\">\n<button class=\"tab-btn active\" onclick=\"navigateTab('developer')\">Developer Guide</button>\n<button class=\"tab-btn\" onclick=\"navigateTab('claude')\">Claude Integration Guide</button>\n</div>"""
          new_tabs = """<div class=\"tab-bar\">\n<a class=\"tab-btn active\" href=\"/dev-guide/developer-mcp-guide/\">Developer Guide</a>\n<a class=\"tab-btn\" href=\"/dev-guide/claude-mcp-guide/\">Claude Integration Guide</a>\n</div>"""

          if old_tabs in html:
              html = html.replace(old_tabs, new_tabs, 1)
          elif '/dev-guide/developer-mcp-guide/' not in html:
              raise SystemExit('Expected tab markup not found')

          if '.tab-btn{text-decoration:none;' not in html:
              html = html.replace('.tab-btn{padding:', '.tab-btn{text-decoration:none;padding:', 1)

          developer = html
          developer = developer.replace('<div id=\"tab-developer\" class=\"tab-content\">', '<div id=\"tab-developer\" class=\"tab-content active\">', 1)
          developer = developer.replace('<div id=\"tab-claude\" class=\"tab-content active\">', '<div id=\"tab-claude\" class=\"tab-content\">', 1)
          developer = developer.replace('<a class=\"tab-btn\" href=\"/dev-guide/developer-mcp-guide/\">Developer Guide</a>', '<a class=\"tab-btn active\" href=\"/dev-guide/developer-mcp-guide/\">Developer Guide</a>', 1)
          developer = developer.replace('<a class=\"tab-btn active\" href=\"/dev-guide/claude-mcp-guide/\">Claude Integration Guide</a>', '<a class=\"tab-btn\" href=\"/dev-guide/claude-mcp-guide/\">Claude Integration Guide</a>', 1)

          claude = html
          claude = claude.replace('<div id=\"tab-developer\" class=\"tab-content active\">', '<div id=\"tab-developer\" class=\"tab-content\">', 1)
          claude = claude.replace('<div id=\"tab-claude\" class=\"tab-content\">', '<div id=\"tab-claude\" class=\"tab-content active\">', 1)
          claude = claude.replace('<a class=\"tab-btn active\" href=\"/dev-guide/developer-mcp-guide/\">Developer Guide</a>', '<a class=\"tab-btn\" href=\"/dev-guide/developer-mcp-guide/\">Developer Guide</a>', 1)
          claude = claude.replace('<a class=\"tab-btn\" href=\"/dev-guide/claude-mcp-guide/\">Claude Integration Guide</a>', '<a class=\"tab-btn active\" href=\"/dev-guide/claude-mcp-guide/\">Claude Integration Guide</a>', 1)

          Path('dev-guide/developer-mcp-guide').mkdir(parents=True, exist_ok=True)
          Path('dev-guide/claude-mcp-guide').mkdir(parents=True, exist_ok=True)
          Path('dev-guide/developer-mcp-guide/index.html').write_text(developer, encoding='utf-8')
          Path('dev-guide/claude-mcp-guide/index.html').write_text(claude, encoding='utf-8')
          src.write_text(html, encoding='utf-8')
          PY

      - name: Commit shareable routes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dev-guide.html dev-guide/developer-mcp-guide/index.html dev-guide/claude-mcp-guide/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add distinct shareable URLs for guide tabs"
          git push
